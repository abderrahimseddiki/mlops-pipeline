# Stack complète : API + monitoring de dérive + MLflow + Prometheus + Grafana
# Prérequis : python -m credit_risk.train (crée models/ et data/reference.csv)
services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data        # journal des prédictions + données de référence
      - ./reports:/app/reports  # rapport de dérive lu par /metrics
    restart: unless-stopped

  monitor:
    build: .
    command: >
      sh -c "while true; do python -m credit_risk.monitor; sleep 120; done"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on: [api]
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes:
      - mlflow:/mlflow

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  mlflow:
